<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>App Abbottabad - Registration</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0b0f19; color: #fff; font-family: sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div class="glass w-full max-w-md p-6 rounded-2xl shadow-2xl">
        <h2 class="text-2xl font-bold mb-2 text-center bg-gradient-to-r from-cyan-400 to-emerald-400 bg-clip-text text-transparent">Register as a Premium Service Provider</h2>
        <p class="text-xs text-gray-400 text-center mb-6">Your data will be instantly saved to our secure cloud backup engine.</p>

        <form id="regForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Full Name</label>
                <input type="text" id="name" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Phone Number</label>
                <input type="tel" id="phone" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Experience (Years)</label>
                <input type="text" id="experience" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Address</label>
                <input type="text" id="address" required class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Service Category</label>
                <select id="category" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500">
                    <option>General Physician</option>
                    <option>Electrician</option>
                    <option>Plumber</option>
                    <option>Carpenter</option>
                    <option>AC Technician</option>
                </select>
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase tracking-wider text-gray-400 mb-1">Description</label>
                <textarea id="description" rows="2" class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm focus:outline-none focus:border-cyan-500"></textarea>
            </div>

            <button type="submit" id="submitBtn" class="w-full bg-gradient-to-r from-cyan-500 to-emerald-500 hover:from-cyan-600 hover:to-emerald-600 font-bold py-3 rounded-lg text-sm transition shadow-lg shadow-cyan-500/20 mt-2">
                🚀 Register Now
            </button>
        </form>
        <div id="statusMsg" class="hidden text-center text-sm font-bold mt-4 p-2 rounded-lg"></div>
    </div>

    <script>
        document.getElementById('regForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const btn = document.getElementById('submitBtn');
            const msg = document.getElementById('statusMsg');
            
            btn.innerText = "Submitting...";
            btn.disabled = true;

            // گوگل شیٹ کے کالمز کے عین مطابق نام (Lowercase)
            const payload = {
                "name": document.getElementById('name').value,
                "phone": document.getElementById('phone').value,
                "experience": document.getElementById('experience').value || "N/A",
                "address": document.getElementById('address').value,
                "category": document.getElementById('category').value,
                "description": document.getElementById('description').value || "N/A"
            };

            try {
                const response = await fetch('https://sheetdb.io/api/v1/rdfg2xphgdnl1', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ data: [payload] })
                });

                if (response.ok) {
                    msg.innerText = "🎉 Registration Successful!";
                    msg.className = "text-emerald-400 bg-emerald-950/50 border border-emerald-500/30 text-center text-sm font-bold mt-4 p-2 rounded-lg block";
                    document.getElementById('regForm').reset();
                } else {
                    throw new Error("Cloud backup error");
                }
            } catch (err) {
                msg.innerText = "⚠️ Submission Failed. Try Again.";
                msg.className = "text-rose-400 bg-rose-950/50 border border-rose-500/30 text-center text-sm font-bold mt-4 p-2 rounded-lg block";
            } finally {
                btn.innerText = "🚀 Register Now";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
